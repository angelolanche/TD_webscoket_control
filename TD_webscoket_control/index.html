<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./public/js/app.js" defer></script>
    <title>BMW Projectors</title>
</head>
<body class="body">
    <section class="button_section">
        <!-- <div class="power">
            <div>
                <button type="button" id="powerOn" class="powerOn"> </button>
            </div>
            <div>
                <button type="button" id="powerOff" class="powerOff"> </button>
            </div>
        </div> -->
        <div class="buttons">
            <div>
            <button type="button" id="play">
                <img src="./assets/play1.png" width="35" height="35"/>
            </button>
            </div>
            <div>
            <button type="button" id="pause">
                <img src="./assets/pause-button.png" width="30" height="32"/>
            </button>
            </div>
            <div>
            <button type="button" id="reset">
                <img src="./assets/reset.png" width="50" height="50"/>
            </button>
            </div>
        </div>
        <div class="buttons volume">
                <label>Volume</label>
                <input type="range" id="volume" min="0" max="100" value="50" />
            </div>
        </div>
    </section>
    <section class="client_section">
        <label>Nome do Cliente:</label>
        <input type="text" class="client_name" id="clientName" value=""/>
    </section>
    <section class="presentation_type">
        <label for="cars">Apresentacao: </label>
            <select name="cars" class="options" id="option">
                <option value="1">Serie M</option>
                <option value="2">Serie X</option>
            </select>
    </section>
    <div class="brand">
        <h3>BMW</h3>
        <p>PROJECTOR CONTROL</p>
    </div>
</body>
</html>
